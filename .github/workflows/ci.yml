name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node 22
    runs-on: windows-latest

    defaults:
      run:
        working-directory: aibox-drpy-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aibox-drpy-source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate public package
        run: npm run validate:public

      - name: Run tests
        run: npm test

      - name: Smoke test CLI
        run: node scripts/aibox-skill-cli.mjs resources list

      - name: Validate zip package
        shell: pwsh
        run: |
          ./scripts/package-skill.ps1 -OutputDir ../packages -PackageName aibox-drpy-source-skill.zip
          if (-not (Test-Path ../packages/aibox-drpy-source-skill.zip)) {
            throw '未生成 zip 包'
          }
